<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bloom — Mini Music Player</title>
<style>
  :root {
    --bg: oklch(0.16 0.03 280);
    --fg: oklch(0.97 0.01 280);
    --muted-fg: oklch(0.72 0.04 285);
    --secondary: oklch(0.28 0.05 290);
    --border: rgba(255,255,255,0.1);
    --primary: oklch(0.75 0.18 350);
    --gradient-player: linear-gradient(145deg, oklch(0.24 0.06 295), oklch(0.18 0.04 280));
    --gradient-accent: linear-gradient(135deg, oklch(0.75 0.18 350), oklch(0.7 0.2 30));
    --shadow-glow: 0 20px 60px -15px rgba(236, 72, 153, 0.5);
    --shadow-art: 0 30px 80px -20px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at top, oklch(0.25 0.08 300), var(--bg));
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .player {
    width: 100%;
    max-width: 24rem;
    border-radius: 1.5rem;
    padding: 1.5rem;
    border: 1px solid var(--border);
    background: var(--gradient-player);
    box-shadow: var(--shadow-glow);
  }
  .art-wrap { position: relative; margin-bottom: 1.5rem; }
  .art {
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 1rem;
    object-fit: cover;
    box-shadow: var(--shadow-art);
    transform: scale(0.97);
    transition: transform 0.7s ease;
  }
  .playing .art { transform: scale(1); }
  .art-glow {
    position: absolute; inset: 0;
    border-radius: 1rem;
    background: var(--gradient-accent);
    opacity: 0.4;
    filter: blur(40px);
    z-index: -1;
  }
  .meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; gap: 0.5rem; }
  .title { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 0.875rem; color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--muted-fg);
    padding: 0.5rem; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color 0.2s, background 0.2s, transform 0.15s;
  }
  .icon-btn:hover { color: var(--fg); background: var(--secondary); }
  .icon-btn.liked { color: var(--primary); }
  .icon-btn.liked svg { fill: var(--primary); }
  .progress-wrap { margin-bottom: 1.25rem; }
  .progress-bar {
    height: 6px; width: 100%;
    background: var(--secondary);
    border-radius: 999px;
    overflow: hidden;
    cursor: pointer;
  }
  .progress-fill {
    height: 100%;
    background: var(--gradient-accent);
    border-radius: 999px;
    width: 0%;
    transition: width 0.3s linear;
  }
  .times { display: flex; justify-content: space-between; margin-top: 0.5rem; font-size: 0.75rem; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .controls { display: flex; align-items: center; justify-content: space-between; }
  .ctrl-main {
    background: none; border: none; cursor: pointer;
    color: var(--fg); padding: 0.5rem;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.15s;
  }
  .ctrl-main:hover { transform: scale(1.1); }
  .play-btn {
    width: 3.5rem; height: 3.5rem;
    border-radius: 999px; border: none; cursor: pointer;
    background: var(--gradient-accent);
    color: oklch(0.15 0.03 280);
    box-shadow: var(--shadow-glow);
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.15s;
  }
  .play-btn:hover { transform: scale(1.05); }
  .play-btn:active { transform: scale(0.95); }
  .play-btn svg { fill: currentColor; }
</style>
</head>

<script>
  const DURATION = 218;
  let progress = 72;
  let playing = false;
  let timer = null;

  const player = document.getElementById('player');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const fill = document.getElementById('progressFill');
  const bar = document.getElementById('progressBar');
  const cur = document.getElementById('current');
  const dur = document.getElementById('duration');
  const likeBtn = document.getElementById('likeBtn');

  const PLAY_SVG = '<polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/>';
  const PAUSE_SVG = '<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>';

  function fmt(s) {
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return m + ':' + sec;
  }
  function render() {
    fill.style.width = (progress/DURATION*100) + '%';
    cur.textContent = fmt(progress);
    dur.textContent = fmt(DURATION);
  }
  function setPlaying(v) {
    playing = v;
    player.classList.toggle('playing', v);
    playIcon.innerHTML = v ? PAUSE_SVG : PLAY_SVG;
    playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play');
    clearInterval(timer);
    if (v) {
      timer = setInterval(() => {
        progress = progress >= DURATION ? 0 : progress + 1;
        render();
      }, 1000);
    }
  }
  playBtn.addEventListener('click', () => setPlaying(!playing));
  bar.addEventListener('click', (e) => {
    const rect = bar.getBoundingClientRect();
    const r = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    progress = r * DURATION;
    render();
  });
  likeBtn.addEventListener('click', () => likeBtn.classList.toggle('liked'));
  render();
</script>
